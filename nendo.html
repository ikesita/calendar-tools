<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>年度・四半期計算｜日付から日本の年度と四半期を表示</title>
<meta name="description" content="日付を入力すると、日本の年度（4月始まり）、四半期（Q1〜Q4）、上半期・下半期を表示する無料ツールです。">
<style>
  :root{ --bg:#f6f7f9; --card:#fff; --ink:#1c2333; --sub:#5b6478; --line:#dde1ea; --acc:#b45309; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 56px}
  header h1{font-size:25px;margin:8px 0 4px}
  header p{color:var(--sub);margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  .f label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
  .f input,.f select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:16px}
  table{width:100%;border-collapse:collapse;font-size:15px}
  td{padding:6px 0;color:var(--sub)} td.v{text-align:right;color:var(--ink);font-weight:800}
  .big{font-size:22px;font-weight:800;color:var(--ink)}
  .note{font-size:13px;color:var(--sub)}
  footer{color:var(--sub);font-size:12.5px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>年度・四半期計算</h1>
    <p>選んだ日付が、日本の年度（4月始まり）で何年度・第何四半期・上半期／下半期のいつに当たるかを表示します。初期表示は今日です。</p>
  </header>

  <div class="card">
    <div class="grid">
      <div class="f"><label>日付</label><input id="date" type="date"></div>
    </div>
    <p class="big" id="headline" style="margin:14px 0 0">-</p>
  </div>

  <div class="card">
    <table>
      <tr><td>日付</td><td class="v" id="rDate">-</td></tr>
      <tr><td>年度（4月1日〜翌年3月31日）</td><td class="v" id="rNendo">-</td></tr>
      <tr><td>四半期</td><td class="v" id="rQuarter">-</td></tr>
      <tr><td>上半期・下半期</td><td class="v" id="rHalf">-</td></tr>
    </table>
    <p class="note" style="margin-top:10px">四半期は、Q1（第1四半期）が4〜6月、Q2が7〜9月、Q3が10〜12月、Q4が1〜3月です。上半期は4〜9月、下半期は10〜3月です。会社や団体によっては、1月始まりの年度や独自の四半期区分を用いる場合があります。</p>
  </div>

  <footer>入力内容はブラウザ内でのみ処理され、送信されません。ほかの日付ツールは「<a href="index.html">暦・日付ツール集</a>」からどうぞ。</footer>
</div>

<script>
const pad = n => String(n).padStart(2, "0");

function calc(){
  const v = document.getElementById("date").value;
  if(!v) return;
  const p = v.split("-").map(Number);
  const y = p[0], m = p[1], d = p[2];

  const nendo = m >= 4 ? y : y - 1;
  let q, qLabel;
  if(m >= 4 && m <= 6){ q = 1; } else if(m >= 7 && m <= 9){ q = 2; }
  else if(m >= 10 && m <= 12){ q = 3; } else { q = 4; }
  qLabel = "第" + q + "四半期（Q" + q + "）";
  const half = (m >= 4 && m <= 9) ? "上半期" : "下半期";

  document.getElementById("rDate").textContent = y + "年" + m + "月" + d + "日";
  document.getElementById("rNendo").textContent = nendo + "年度（" + nendo + "年4月1日 〜 " + (nendo + 1) + "年3月31日）";
  document.getElementById("rQuarter").textContent = qLabel;
  document.getElementById("rHalf").textContent = half;
  document.getElementById("headline").textContent = y + "年" + m + "月" + d + "日 は " + nendo + "年度・" + qLabel + "・" + half + " です";
}
const dateEl = document.getElementById("date");
const now = new Date();
dateEl.value = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate());
dateEl.addEventListener("input", calc);
calc();
</script>
</body>
</html>
