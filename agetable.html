<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>年齢早見表｜生まれ年から満年齢・数え年を一覧表示</title>
<meta name="description" content="生まれ年（西暦）を入力すると、2024年〜2030年の各年に迎える満年齢と数え年を一覧表で表示する無料ツールです。今年の行を強調表示します。">
<style>
  :root{ --bg:#f6f7f9; --card:#fff; --ink:#1c2333; --sub:#5b6478; --line:#dde1ea; --acc:#b45309; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 56px}
  header h1{font-size:25px;margin:8px 0 4px}
  header p{color:var(--sub);margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  .f label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
  .f input,.f select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:16px}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{padding:6px 8px;color:var(--sub);font-weight:600;text-align:right;border-bottom:1px solid var(--line)}
  th:first-child{text-align:left}
  td{padding:6px 8px;color:var(--sub);text-align:right}
  td:first-child{text-align:left}
  tr.now td{color:var(--ink);font-weight:800;background:#fdf6ec}
  .note{font-size:13px;color:var(--sub)}
  footer{color:var(--sub);font-size:12.5px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>年齢早見表</h1>
    <p>生まれ年から、各年に迎える満年齢と数え年を一覧で確認できます。今年の行は色付きで表示されます。</p>
  </header>

  <div class="card">
    <div class="grid">
      <div class="f"><label>生まれ年（西暦）</label><input id="year" type="number" min="1900" max="2100" step="1" value="1990"></div>
    </div>
    <p class="note" style="margin-top:10px">満年齢は「その年の誕生日を迎えた時点でなる年齢」、数え年は「生まれた年を1歳とし、元日に1歳加える」数え方です。</p>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th>西暦</th><th>満年齢（誕生日時点）</th><th>数え年</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="note" style="margin-top:10px" id="summary"></p>
    <p class="note" style="margin-top:6px">満年齢は誕生日の前日が終わる時点で加算されるのが法律上の扱いですが、ここでは「その年に迎える年齢」として簡易に計算しています。厄年や還暦などの行事は数え年で数えるのが慣例です。あくまで目安としてご利用ください。</p>
  </div>

  <footer>入力内容はブラウザ内でのみ処理され、送信されません。ほかの日付ツールは「<a href="index.html">暦・日付ツール集</a>」からどうぞ。</footer>
</div>

<script>
function calc(){
  const birth = parseInt(document.getElementById("year").value, 10);
  const tbody = document.getElementById("rows");
  const summary = document.getElementById("summary");
  if(!birth){ tbody.innerHTML = ""; summary.textContent = ""; return; }
  const thisYear = new Date().getFullYear();
  let html = "";
  for(let y = 2024; y <= 2030; y++){
    const man = y - birth;
    const kazo = man + 1;
    html += "<tr" + (y === thisYear ? " class=\"now\"" : "") + "><td>" + y + " 年" + (y === thisYear ? "（今年）" : "") + "</td><td>" + man + " 歳</td><td>" + kazo + " 歳</td></tr>";
  }
  tbody.innerHTML = html;
  summary.textContent = "今年（" + thisYear + "年）は、満 " + (thisYear - birth) + " 歳・数え年 " + (thisYear - birth + 1) + " 歳を迎えます。";
}
document.getElementById("year").addEventListener("input", calc);
calc();
</script>
</body>
</html>
