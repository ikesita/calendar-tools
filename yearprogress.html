<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今年の残り日数と進捗｜今日が1年の何日目か・何％終わったかを表示</title>
<meta name="description" content="今日（または指定した日）がその年の何日目か、経過日数・残り日数・進捗％・残り週数の目安を表示する無料ツールです。">
<style>
  :root{ --bg:#f6f7f9; --card:#fff; --ink:#1c2333; --sub:#5b6478; --line:#dde1ea; --acc:#b45309; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 56px}
  header h1{font-size:25px;margin:8px 0 4px}
  header p{color:var(--sub);margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  .f label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
  .f input,.f select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:16px}
  .bar{background:var(--bg);border:1px solid var(--line);border-radius:999px;height:16px;overflow:hidden;margin-top:6px}
  .bar > div{background:var(--acc);height:100%;width:0}
  table{width:100%;border-collapse:collapse;font-size:15px}
  td{padding:6px 0;color:var(--sub)} td.v{text-align:right;color:var(--ink);font-weight:800}
  .note{font-size:13px;color:var(--sub)}
  footer{color:var(--sub);font-size:12.5px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>今年の残り日数と進捗</h1>
    <p>選んだ日がその年の何日目か、今年あと何日残っているか、1年の進捗を表示します。初期表示は今日です。</p>
  </header>

  <div class="card">
    <div class="grid">
      <div class="f"><label>日付</label><input id="date" type="date"></div>
    </div>
    <div class="bar"><div id="barFill"></div></div>
    <p class="note" style="margin-top:8px">バーの長さが、その年の進捗（経過割合）です。</p>
  </div>

  <div class="card">
    <table>
      <tr><td>年の何日目</td><td class="v" id="doy">-</td></tr>
      <tr><td>経過日数（その日を含む）</td><td class="v" id="elapsed">-</td></tr>
      <tr><td>残り日数（翌日〜大晦日）</td><td class="v" id="remain">-</td></tr>
      <tr><td>進捗</td><td class="v" id="pct">-</td></tr>
      <tr><td>残り週数（概数）</td><td class="v" id="weeks">-</td></tr>
    </table>
    <p class="note" style="margin-top:10px">経過日数は、その年の1月1日を1日目として、その日を含めて数えた日数です。残り週数は残り日数を7で割った概数です。うるう年は1年が366日として計算します。</p>
  </div>

  <footer>入力内容はブラウザ内でのみ処理され、送信されません。ほかの日付ツールは「<a href="index.html">暦・日付ツール集</a>」からどうぞ。</footer>
</div>

<script>
function isLeap(y){ return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }

function calc(){
  const v = document.getElementById("date").value;
  if(!v) return;
  const parts = v.split("-").map(Number);
  const y = parts[0], m = parts[1], d = parts[2];
  const start = Date.UTC(y, 0, 1);
  const cur = Date.UTC(y, m - 1, d);
  const doy = Math.round((cur - start) / 86400000) + 1;
  const total = isLeap(y) ? 366 : 365;
  const remain = total - doy;
  const pct = doy / total * 100;
  document.getElementById("doy").textContent = doy + " 日目 / " + total + " 日";
  document.getElementById("elapsed").textContent = doy + " 日";
  document.getElementById("remain").textContent = remain + " 日";
  document.getElementById("pct").textContent = pct.toFixed(1) + " ％";
  document.getElementById("weeks").textContent = "約 " + (remain / 7).toFixed(1) + " 週間";
  document.getElementById("barFill").style.width = pct + "%";
}
const dateEl = document.getElementById("date");
const now = new Date();
const pad = n => String(n).padStart(2, "0");
dateEl.value = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate());
dateEl.addEventListener("input", calc);
calc();
</script>
</body>
</html>
